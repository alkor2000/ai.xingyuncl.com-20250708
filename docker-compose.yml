version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: ai-platform-mysql
    restart: unless-stopped
    environment:
      # 强制从环境变量读取，无默认值
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/charset.cnf:ro
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--default-character-set=utf8mb4"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: ai-platform-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ai-platform-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_CHARSET: utf8mb4
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # JWT密钥强制配置
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES: 24h
      JWT_REFRESH_EXPIRES: 30d
      # 域名配置
      APP_DOMAIN: ${APP_DOMAIN}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOG_DIR: /app/logs
      # 产品反馈：仅注入后端运行时，各部署实例使用独立凭据。
      PRODUCT_FEEDBACK_HUB_URL: "${PRODUCT_FEEDBACK_HUB_URL:-}"
      PRODUCT_FEEDBACK_CLIENT_ID: "${PRODUCT_FEEDBACK_CLIENT_ID:-}"
      PRODUCT_FEEDBACK_CLIENT_SECRET: "${PRODUCT_FEEDBACK_CLIENT_SECRET:-}"
      PRODUCT_FEEDBACK_SUBJECT_SECRET: "${PRODUCT_FEEDBACK_SUBJECT_SECRET:-}"
      # Identity仅作为后端运行配置注入，不进入镜像构建参数或前端环境。
      # 未配置时保持关闭；已有部署的显式客户端及回调配置原样传递。
      IDENTITY_ENABLED: "${IDENTITY_ENABLED:-false}"
      IDENTITY_ISSUER: "${IDENTITY_ISSUER:-https://id.pkuailab.com}"
      IDENTITY_PUBLIC_ORIGIN: "${IDENTITY_PUBLIC_ORIGIN:-}"
      IDENTITY_CLIENT_ID: "${IDENTITY_CLIENT_ID:-}"
      IDENTITY_CLIENT_SECRET: "${IDENTITY_CLIENT_SECRET:-}"
      # 新增字段默认空，不改变旧环境变量接入方式；私有挂载由可选附加配置提供。
      IDENTITY_DEPLOYMENT_INSTANCE_KEY: "${IDENTITY_DEPLOYMENT_INSTANCE_KEY:-}"
      IDENTITY_CREDENTIALS_FILE: "${IDENTITY_CREDENTIALS_FILE:-}"
      IDENTITY_TOKEN_AUTH_METHOD: "${IDENTITY_TOKEN_AUTH_METHOD:-client_secret_post}"
      # 空值由后端按当前部署来源推导，避免在Compose中固定某一客户域名。
      IDENTITY_LOGIN_REDIRECT_URI: "${IDENTITY_LOGIN_REDIRECT_URI:-}"
      IDENTITY_BIND_REDIRECT_URI: "${IDENTITY_BIND_REDIRECT_URI:-}"
      IDENTITY_BACKCHANNEL_URL: "${IDENTITY_BACKCHANNEL_URL:-}"
      IDENTITY_FLOW_TTL_SECONDS: "${IDENTITY_FLOW_TTL_SECONDS:-600}"
      IDENTITY_HANDOFF_TTL_SECONDS: "${IDENTITY_HANDOFF_TTL_SECONDS:-90}"
      IDENTITY_HTTP_TIMEOUT_MS: "${IDENTITY_HTTP_TIMEOUT_MS:-10000}"
      IDENTITY_JWKS_CACHE_SECONDS: "${IDENTITY_JWKS_CACHE_SECONDS:-300}"
    volumes:
      - ./storage/uploads:/app/storage/uploads
      - ./logs/backend:/app/logs
    networks:
      - ai-network
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        CUSTOMER_DOMAIN: ${CUSTOMER_DOMAIN}
    container_name: ai-platform-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      TZ: Asia/Shanghai
      CUSTOMER_DOMAIN: ${CUSTOMER_DOMAIN}
    volumes:
      - ${SSL_CERT_PATH:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ./storage/uploads:/app/storage/uploads:ro
      - ./certbot:/var/www/certbot:ro
    networks:
      - ai-network
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
networks:
  ai-network:
    driver: bridge
volumes:
  mysql_data:
  redis_data:
